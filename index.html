<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Waldemar WD</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <style>
        :root { --bg: #121212; --card: #1c1c1c; --primary: #e67e22; --text: #ffffff; --success: #27ae60; --danger: #c0392b; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
        }
        
        /* CONTAINER RESPONSIVO */
        .app-container { 
            width: 100%; 
            max-width: 500px; /* Limite para Tablets/PC */
            height: 100vh; 
            background: var(--bg); 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* Ajuste para telas maiores (Simular App no PC) */
        @media (min-width: 600px) {
            .app-container {
                height: 92vh;
                border: 6px solid #333;
                border-radius: 30px;
            }
        }

        .screen { display: none; height: 100%; padding: 20px; overflow-y: auto; }
        .screen.active { display: block; }

        /* TOAST AVISO */
        #toast-aviso {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            width: 90%; background: var(--primary); color: white; padding: 15px;
            border-radius: 12px; text-align: center; font-weight: bold; z-index: 1000;
            transition: 0.5s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        #toast-aviso.show { top: 20px; }
        
        /* TÍTULOS RESPONSIVOS */
        h3 { 
            color: var(--primary); 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 28px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estilo especial para o título da Barbearia na Home */
        .titulo-principal {
            font-size: 45px !important; /* Ajustado para não estourar em celulares pequenos */
            line-height: 1;
            margin-top: 40px;
        }

        @media (max-width: 380px) {
            .titulo-principal { font-size: 35px !important; }
            h3 { font-size: 24px; }
        }

        label { display: block; margin: 15px 0 8px; color: var(--primary); font-weight: bold; font-size: 14px; text-transform: uppercase; }
        small { color: #888; font-size: 11px; margin-bottom: 10px; display: block; }
        
        input { width: 100%; padding: 15px; background: #2a2a2a; border: 1px solid #444; border-radius: 12px; color: #fff; margin-bottom: 10px; outline: none; font-size: 16px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item { background: var(--card); padding: 15px; border-radius: 15px; text-align: center; border: 2px solid transparent; cursor: pointer; transition: 0.3s; }
        .item span { font-size: 24px; display: block; margin-bottom: 5px; }
        .item p { font-size: 13px; font-weight: 600; margin: 0; color: #eee; }
        .item.selected { border-color: var(--primary); background: rgba(230, 126, 34, 0.15); }

        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .time-slot { padding: 10px 5px; border-radius: 8px; text-align: center; font-size: 14px; font-weight: bold; border: 2px solid var(--primary); color: var(--primary); cursor: pointer; }
        .time-slot.selected { background: var(--success); border-color: var(--success); color: white; }
        .time-slot.occupied { background: var(--danger); border-color: var(--danger); color: white; opacity: 0.8; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; text-transform: uppercase; }
        .btn-back { background: #333; margin-top: 10px; }
        
        .appointment-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); font-size: 14px; }
        .tel-link { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="toast-aviso">Mensagem</div>

    <div id="screen-login" class="screen active">
        <h3 class="titulo-principal">Barbearia Waldemar</h3>
        <!--
        <p style="text-align:center; color:gray; font-weight:bold; margin-bottom:30px;">WORK DESIGN</p>
        -->
        
        <label>Seu Nome</label>
        <input type="text" id="login-user" placeholder="Digite seu nome">
        <label>Celular (Senha)</label>
        <small>Use seu número para acessar a conta</small>
        <input type="tel" id="login-pass" placeholder="Ex: 82999998888">
        <button class="btn" onclick="checkLogin()">ACESSAR SISTEMA</button>
    </div>

    <div id="screen-staff" class="screen">
        <h3>Profissional</h3>
        <div class="grid">
            <div class="item" onclick="selSt(this, 'Valdemar')"><span>👨🏻‍💼</span><p>Valdemar</p></div>
            <div class="item" onclick="selSt(this, 'Outros')"><span>💈</span><p>Outros</p></div>
        </div>
        <button class="btn btn-back" onclick="nav('screen-login')">VOLTAR</button>
    </div>

    <div id="screen-services" class="screen">
        <h3>Serviços</h3>
        <div class="grid">
            <div class="item" onclick="selSr(this, 'Corte/Tesoura', 30)"><span>✂️</span><p>Corte/Tesoura</p></div>
            <div class="item" onclick="selSr(this, 'Corte/Degradê', 30)"><span>🖲️</span><p>Corte/Degradê</p></div>
            <div class="item" onclick="selSr(this, 'Barba', 25)"><span>🪒</span><p>Barba</p></div>
            <div class="item" onclick="selSr(this, 'Combo', 50)"><span>🧔</span><p>Combo</p></div>
            <div class="item" onclick="selSr(this, 'Luzes', 30)"><span>💡</span><p>Luzes</p></div>
            <div class="item" onclick="selSr(this, 'Corte/pigmentação', 30)"><span>🎨</span><p>Corte/Pigmentação</p></div>
        </div>
        <button class="btn btn-back" onclick="nav('screen-staff')">VOLTAR</button>
    </div>

    <div id="screen-booking" class="screen">
        <h3>Agendamento</h3>
        <label>Selecione a Data</label>
        <input type="date" id="book-date" onchange="atualizarHorariosDisponiveis()">
        <label>Horários</label>
        <div id="time-container" class="time-grid"></div>
        <button class="btn" id="btn-reservar" onclick="confirmarAgendamento()">RESERVAR AGORA</button>
        <button class="btn btn-back" onclick="nav('screen-services')">VOLTAR</button>
    </div>

    <div id="screen-admin" class="screen">
        <h3>Painel Admin</h3>
        <div id="admin-list">Carregando...</div>
        <button class="btn btn-back" onclick="nav('screen-login')">SAIR</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://barbearia-valdemar-default-rtdb.firebaseio.com",
        projectId: "barbearia-valdemar",
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const WHATSAPP_ADMIN = "5582999480685";

    let sStaff = "", sService = "", sDur = 0, sTime = "", sUser = "", sPhone = "";

    function mostrarAviso(texto, cor = "#e67e22") {
        const toast = document.getElementById('toast-aviso');
        toast.innerText = texto;
        toast.style.background = cor;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-admin') renderAdmin();
        if(id === 'screen-booking') gerarTabelaHorarios();
    }

    function checkLogin() {
        const u = document.getElementById('login-user').value.trim();
        const p = document.getElementById('login-pass').value.trim();
        if(u === "WD" && p === "9994") { nav('screen-admin'); return; }
        if(u !== "" && (p.length === 8 || p.length === 9 || p.length === 11)) {
            sUser = u; sPhone = p; nav('screen-staff');
        } else {
            mostrarAviso("Nome e Celular obrigatórios!", "var(--danger)");
        }
    }

    function selSt(el, n) {
        document.querySelectorAll('#screen-staff .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); sStaff = n;
        setTimeout(() => nav('screen-services'), 300);
    }

    function selSr(el, s, d) {
        document.querySelectorAll('#screen-services .item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); sService = s; sDur = d;
        setTimeout(() => nav('screen-booking'), 300);
    }

    function gerarTabelaHorarios() {
        const container = document.getElementById('time-container');
        container.innerHTML = "";
        const horarios = ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00"];
        
        horarios.forEach(hora => {
            const div = document.createElement('div');
            div.className = 'time-slot';
            div.innerText = hora;
            div.onclick = () => {
                if(div.classList.contains('occupied')) {
                    mostrarAviso("⚠️ Horário já ocupado!", "var(--danger)");
                    return;
                }
                document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                div.classList.add('selected'); 
                sTime = hora;
            };
            container.appendChild(div);
        });
        atualizarHorariosDisponiveis();
    }

    function atualizarHorariosDisponiveis() {
        const data = document.getElementById('book-date').value;
        if(!data || !sStaff) return;
        database.ref('agendamentos').once('value').then(snap => {
            const ags = snap.val();
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('occupied', 'selected');
                const h = slot.innerText;
                if(ags) {
                    Object.values(ags).forEach(ag => {
                        if(ag.data === data && ag.profissional === sStaff && ag.hora === h) {
                            slot.classList.add('occupied');
                        }
                    });
                }
            });
        });
    }

    function confirmarAgendamento() {
        const data = document.getElementById('book-date').value;
        if(!data || !sTime) return mostrarAviso("Escolha Data e Horário!", "var(--danger)");
        const btn = document.getElementById('btn-reservar');
        btn.innerText = "SALVANDO..."; btn.disabled = true;

        database.ref('agendamentos').push({
            cliente: sUser, telefone: sPhone, profissional: sStaff, servico: sService,
            duracao: sDur, data, hora: sTime
        }).then(() => {
            mostrarAviso("✅ Sucesso! Horário reservado.", "var(--success)");
            const msg = `Novo Agendamento!%0A👤 Cliente: ${sUser}%0A📞 Tel: ${sPhone}%0A✂️ Serviço: ${sService}%0A👨‍🦱 Profissional: ${sStaff}%0A📅 Data: ${data}%0A⏰ Hora: ${sTime}`;
            setTimeout(() => {
                window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_ADMIN}&text=${msg}`, '_blank');
                location.reload(); 
            }, 1500);
        });
    }

    function renderAdmin() {
        const container = document.getElementById('admin-list');
        database.ref('agendamentos').on('value', (snap) => {
            container.innerHTML = "";
            const val = snap.val();
            if(!val) return container.innerHTML = "Agenda vazia.";
            Object.keys(val).forEach(id => {
                const ag = val[id];
                container.innerHTML += `<div class="appointment-card">
                    <strong style="color:var(--primary)">${ag.profissional}</strong> | ${ag.cliente}<br>
                    <span>📞 <a href="tel:${ag.telefone}" class="tel-link">${ag.telefone}</a></span><br>
                    <span>${ag.servico} - ${ag.data} às ${ag.hora}</span>
                    <button class="btn" style="background:var(--danger); padding:5px; margin-top:8px;" onclick="del('${id}')">REMOVER</button>
                </div>`;
            });
        });
    }

    function del(id) { if(confirm("Deseja realmente excluir este agendamento?")) database.ref('agendamentos/' + id).remove(); }
</script>
</body>
</html>
